<div class="fraction-disc" role="img" aria-label="A circle split into two equal parts with one part shaded"></div>
<span class="prism-peek" data-prism="celebrate" aria-hidden="true"></span>

<button class="answer-option" type="button" role="radio" aria-checked="false" aria-label="one third" data-correct="false"><span class="fraction" aria-hidden="true"><span>1</span><span class="fraction__bar"></span><span>3</span></span></button>
<button class="answer-option is-correct" type="button" role="radio" aria-checked="true" aria-label="two fourths" data-correct="true"><span class="answer-option__state" aria-hidden="true">✓</span><span class="fraction" aria-hidden="true"><span>2</span><span class="fraction__bar"></span><span>4</span></span></button>
<button class="answer-option" type="button" role="radio" aria-checked="false" aria-label="three fourths" data-correct="false"><span class="fraction" aria-hidden="true"><span>3</span><span class="fraction__bar"></span><span>4</span></span></button>
<button class="answer-option" type="button" role="radio" aria-checked="false" aria-label="two thirds" data-correct="false"><span class="fraction" aria-hidden="true"><span>2</span><span class="fraction__bar"></span><span>3</span></span></button>

<p><span aria-label="two fourths">2/4</span> and <span aria-label="one half">1/2</span> show the same amount.</p>
